[project]
name = "squidiff-reusability-audit"
version = "1.1.0"
description = "Auditable, test-driven feasibility gate for biomedical reusability candidate selection"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "anndata>=0.9",
    "scanpy>=1.10",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
torch = ["torch>=2.0"]
metrics = ["pot>=0.9", "geomloss>=0.2"]

[project.scripts]
reuse-gate = "reuse_gate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reuse_gate"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["vendor/", ".venv/", "dist/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["anndata.*", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: tests that require network or Docker access",
    "gpu: tests that require a GPU",
    "slow: tests that are expensive to run",
]
